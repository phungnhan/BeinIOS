<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BeinGroup Chat</title>
  <link rel="icon" href="icons/icon48.png" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Danh sách cuộc trò chuyện">
      <header class="side-head">
        <div class="brand">
          <img src="icons/icon48.png" alt="" width="30" height="30" />
          <div><b>Chat</b><span>BeinGroup</span></div>
        </div>
        <a class="icon-btn" href="dashboard.html" title="Mở Dashboard" aria-label="Mở Dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm8 0h8v-9h-8v9Zm0-16v5h8V4h-8Z" /></svg>
        </a>
      </header>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.2 4.2-1.4 1.4-4.2-4.2A6.5 6.5 0 1 1 10.5 4Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z" /></svg>
        <input id="q" type="search" placeholder="Tìm cuộc trò chuyện…" aria-label="Tìm cuộc trò chuyện" autocomplete="off" />
      </label>
      <div class="chips" id="filters">
        <button type="button" data-f="all" class="on">Tất cả</button>
        <button type="button" data-f="unread">Chưa đọc <span class="chip-n" id="cnt-unread"></span></button>
        <button type="button" data-f="dm">Tin nhắn riêng</button>
      </div>
      <nav class="list" id="list"></nav>
      <footer class="side-foot" id="me"></footer>
    </aside>

    <main class="conv" id="conv">
      <section class="empty" id="empty">
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2Zm3 5v2h10V9H7Zm0 4v2h7v-2H7Z" /></svg>
        </div>
        <h2 id="empty-title">Đang mở chat…</h2>
        <p id="empty-text">Tin nhắn riêng và kênh chat sẽ hiện ở bên trái trong giây lát.</p>
        <button type="button" class="primary" id="btn-enable" hidden>Kết nối Chat Beincom</button>
      </section>

      <header class="conv-head" id="conv-head" hidden>
        <button type="button" class="icon-btn back" id="back" aria-label="Quay lại danh sách">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.7 5.3 1.4 1.4L10.8 12l5.3 5.3-1.4 1.4L8 12l6.7-6.7Z" /></svg>
        </button>
        <div class="avatar lg" id="conv-avatar"></div>
        <div class="conv-title">
          <b id="conv-title"></b>
          <span id="conv-sub"></span>
        </div>
        <a class="icon-btn" id="conv-web" target="_blank" title="Mở trên web Beincom" aria-label="Mở trên web Beincom">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6h-2V7.4l-7.3 7.3-1.4-1.4L16.6 6H14V4ZM5 6h6v2H6v10h10v-5h2v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z" /></svg>
        </a>
      </header>

      <div class="msgs" id="msgs" hidden>
        <button type="button" class="older" id="older" hidden>Tải tin cũ hơn</button>
        <div id="msg-list" role="log" aria-live="polite"></div>
      </div>
      <button type="button" class="jump" id="jump" hidden aria-label="Xuống tin mới nhất">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v12.2l4.6-4.6 1.4 1.4-7 7-7-7 1.4-1.4 4.6 4.6V4Z" /></svg>
        <span id="jump-n"></span>
      </button>

      <form class="composer" id="composer" hidden>
        <div class="reply" id="reply" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11Z" /></svg>
          <span id="reply-text"></span>
          <button type="button" class="icon-btn sm" id="reply-x" aria-label="Huỷ trả lời">✕</button>
        </div>
        <div class="box">
          <textarea id="text" rows="1" maxlength="4000" placeholder="Nhắn tin…" aria-label="Nội dung tin nhắn"></textarea>
          <button type="submit" class="send" id="send" aria-label="Gửi" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z" /></svg>
          </button>
        </div>
        <div class="hint" id="hint">Enter để gửi · Shift + Enter xuống dòng</div>
      </form>
    </main>
  </div>

  <!-- Xem ảnh phóng to: bấm ảnh trong tin nhắn; nhiều ảnh thì chuyển qua lại như playlist -->
  <dialog id="viewer" class="viewer" aria-label="Xem ảnh">
    <header class="v-head">
      <div class="v-info">
        <b id="v-name"></b>
        <span id="v-meta"></span>
      </div>
      <span class="v-count" id="v-count"></span>
      <button type="button" class="v-btn" id="v-goto" title="Đóng và tới tin nhắn có ảnh này">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V5a1 1 0 0 1 1-1Zm3 5v2h10V9H7Zm0 4v2h7v-2H7Z" /></svg>
        <span>Tới tin nhắn</span>
      </button>
      <a class="v-btn" id="v-open" target="_blank" rel="noopener noreferrer" title="Mở ảnh trong tab mới">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6h-2V7.4l-7.3 7.3-1.4-1.4L16.6 6H14V4ZM5 6h6v2H6v10h10v-5h2v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z" /></svg>
        <span>Mở tab mới</span>
      </a>
      <button type="button" class="v-btn icon" id="v-close" title="Đóng (Esc)" aria-label="Đóng (Esc)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z" /></svg>
      </button>
    </header>
    <div class="v-stage" id="v-stage"></div>
    <button type="button" class="v-nav prev" id="v-prev" title="Ảnh trước (←)" aria-label="Ảnh trước">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5 16.8 6.4 11.2 12l5.6 5.6-1.4 1.4-7-7 7-7Z" /></svg>
    </button>
    <button type="button" class="v-nav next" id="v-next" title="Ảnh sau (→)" aria-label="Ảnh sau">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5 7.2 6.4l5.6 5.6-5.6 5.6L8.6 19l7-7-7-7Z" /></svg>
    </button>
    <nav class="v-thumbs" id="v-thumbs" aria-label="Các ảnh trong cuộc trò chuyện" hidden></nav>
  </dialog>

  <dialog id="ask" class="ask">
    <form method="dialog">
      <h3 id="ask-title"></h3>
      <p id="ask-text"></p>
      <p class="ask-note" id="ask-note"></p>
      <div class="ask-actions">
        <button value="cancel">Huỷ</button>
        <button value="ok" class="danger" id="ask-ok">Xoá</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="common.js"></script>
  <script src="lib/content.js"></script>
  <script src="lib/members.js"></script>
  <script src="lib/compose.js"></script>
  <script src="lib/article.js"></script>
  <script src="lib/manage.js"></script>
  <script src="lib/reports.js"></script>
  <script src="lib/telegram.js"></script>
  <script src="lib/diag.js"></script>
  <script src="lib/chat.js"></script>
  <script src="chat-app.js"></script>
</body>
</html>
