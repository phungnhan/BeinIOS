# Giữ giống wrangler.toml ở gốc repo (Worker nối repo GitHub dựng bằng tệp đó).
name = "beinios-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Trang được dùng proxy (địa chỉ GitHub Pages của bạn, không có đường dẫn). Nhiều trang: ngăn cách bằng dấu phẩy.
[vars]
ALLOWED_ORIGIN = "https://phungnhan.github.io"

# PROXY_KEY là khoá bí mật — KHÔNG ghi vào tệp này. Đặt bằng lệnh:
#   npx wrangler secret put PROXY_KEY

# Không ghi nhật ký yêu cầu (trong yêu cầu có cookie đăng nhập Beincom)
[observability]
enabled = false

# Chuyển nhanh đăng nhập từ addon (/handoff): mỗi lần chuyển là một Durable Object giữ bản mã hoá tối đa 5 phút.
# Cloudflare tự tạo khi dựng (gói miễn phí dùng được, kiểu lưu SQLite) — không phải cài gì thêm.
[[durable_objects.bindings]]
name = "HANDOFF"
class_name = "Handoff"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Handoff"]
